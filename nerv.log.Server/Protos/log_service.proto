syntax = "proto3";

option csharp_namespace = "nerv.log";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

service LogIngestion {
  rpc StreamLogs(stream LogRequest) returns (IngestionResponse);
}

service LogAnalytics {
  rpc GetStats(StatsRequest) returns (StatsResponse);
  rpc GetBruteForceFindings(BruteForceRequest) returns (BruteForceResponse);
  rpc GetErrorSpikes(ErrorSpikeRequest) returns (ErrorSpikeResponse);
}

service LogMaintenance {
  rpc Vacuum(VacuumRequest) returns (VacuumResponse);
}

enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_TRACE = 1;
  LOG_LEVEL_DEBUG = 2;
  LOG_LEVEL_INFO = 3;
  LOG_LEVEL_WARNING = 4;
  LOG_LEVEL_ERROR = 5;
  LOG_LEVEL_CRITICAL = 6;
}

message LogRequest {
  google.protobuf.Timestamp timestamp = 1;
  
  LogLevel level = 2;
  
  string service_name = 3;
  
  string message = 4;
  
  string environment = 5;

  google.protobuf.Struct metadata = 6;
}

message IngestionResponse {
  bool success = 1;
  int64 logs_processed = 2;
  string message = 3;
}

message StatsRequest {
  google.protobuf.Timestamp from = 1;

  google.protobuf.Timestamp to = 2;

  // Optional filter; empty string means all services.
  string service_name = 3;

  // Optional filter; empty string means all environments.
  string environment = 4;

  // Optional filter; empty string means no metadata filter. Combined with metadata_value.
  string metadata_key = 5;

  // Value to match against metadata_key. Ignored when metadata_key is empty.
  string metadata_value = 6;
}

message LevelCount {
  string level = 1;
  int64 count = 2;
}

message ServiceStats {
  string service_name = 1;
  int64 total = 2;
  int64 errors = 3;
}

message StatsResponse {
  int64 total_logs = 1;
  repeated LevelCount levels = 2;
  repeated ServiceStats services = 3;
}

message BruteForceRequest {
  google.protobuf.Timestamp from = 1;

  google.protobuf.Timestamp to = 2;

  // Optional filter; empty string means all services.
  string service_name = 3;

  // Minimum number of failures within burst_seconds that raises a finding.
  int32 threshold = 4;

  // Size (in seconds) of the sliding window used to detect a burst of failures.
  int32 burst_seconds = 5;

  // Optional filter; empty string means all environments.
  string environment = 6;

  // Optional filter; empty string means no metadata filter. Combined with metadata_value.
  string metadata_key = 7;

  // Value to match against metadata_key. Ignored when metadata_key is empty.
  string metadata_value = 8;
}

message BruteForceFinding {
  string service_name = 1;
  int64 failure_count = 2;
  google.protobuf.Timestamp window_start = 3;
  google.protobuf.Timestamp window_end = 4;
}

message BruteForceResponse {
  repeated BruteForceFinding findings = 1;
}

message ErrorSpikeRequest {
  google.protobuf.Timestamp from = 1;

  google.protobuf.Timestamp to = 2;

  // Optional filter; empty string means all services.
  string service_name = 3;

  // Minimum number of errors in a bucket that raises a finding.
  int32 threshold = 4;

  // Size (in seconds) of each fixed time bucket used to compare error counts.
  int32 bucket_seconds = 5;

  // Optional filter; empty string means all environments.
  string environment = 6;

  // Optional filter; empty string means no metadata filter. Combined with metadata_value.
  string metadata_key = 7;

  // Value to match against metadata_key. Ignored when metadata_key is empty.
  string metadata_value = 8;
}

message ErrorSpikeFinding {
  string service_name = 1;
  int64 error_count = 2;
  double baseline_average = 3;
  google.protobuf.Timestamp bucket_start = 4;
  google.protobuf.Timestamp bucket_end = 5;
}

message ErrorSpikeResponse {
  repeated ErrorSpikeFinding findings = 1;
}

message VacuumRequest {
  // Deletes logs older than this many days.
  int32 older_than_days = 1;

  // If true, Error/Critical logs are kept regardless of age.
  bool keep_errors = 2;
}

message VacuumResponse {
  int64 deleted_count = 1;
  double duration_seconds = 2;
}